<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>상품 목록</title>
</head>

<body>
<th:block th:replace="~{include/header :: headerFragment }"></th:block>
<h2>회사상세</h2>
<div th:switch="${comp}">
	<div th:case="${null}">
		<p>등록된 회사가 없습니다.</p>
	</div>
	<div th:case="*">
		<table border="1" style="border-collapse: collapse;">
			<tr><th>회사번호 : </th><td colspan="2" th:text="${comp.cno}"></td></tr>
			<tr><th>회사이름 : </th><td colspan="2" th:text="${comp.name}"></td></tr>
			<tr><th>회사위치 : </th><td colspan="2" th:text="${comp.cno}"></td></tr>
			<tr><th>상품번호</th><th>상품이름</th><th>상품가격</th></tr>
			<tr th:each="prod:${comp.prods}">
				<td th:text="${prod.num}"></td>
			    <td><a th:href="@{/detail(num=${prod.num})}">[[${prod.title}]]</a></td>
			    <td th:text="${prod.price}"></td>
			</tr>
		</table>
	</div>
</div>
<p>
<a th:href="@{/regist}">상품등록</a>
<a th:href="@{/list}">상품목록</a>
<a th:href="@{/}">메인으로</a>
</body>
</html>
