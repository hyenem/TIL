<%@ page language="java" contentType="text/html; charset=UTF-8"
    pageEncoding="UTF-8"%>
<%@ taglib prefix="c" uri="jakarta.tags.core" %>
<c:set var="root" value ="${pageContext.request.contextPath}"/>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>상품REST</title>
</head>
<body>
<h1>상품REST</h1>
<button id="blst" onclick="list()">목록 조회</button>
<ul id="list">
</ul>
<button id="badd" onclick="regi()">등록</button>
<button id="bupd" onclick="upda()">수정</button>
<button id="bdel" onclick="dele()">삭제</button>
<button id="bcle" onclick="clea()">초기화</button>
<br>
<form>
상품번호: <input id="num" value="1004"><br>
상품이름: <input id="title" value="SmartTV"><br>
상품가격: <input id="price" value="40000"><br>
상품회사: <select id="cno">
	<option value="">회사</option>
</select><br>
</form>
<div id="result"></div>
<a href="${root}/">홈으로</a>
<script>
document.querySelector("#blst").onclick();
addOptions("")

function print(msg){
	document.querySelector("#result").innerText = msg;
}

function addOptions(cno) {
	fetch("${root}/api/v1/comp")
	.then(resp => resp.json())
	.then(comps => {
		let ops = '<option value="">회사</option>';
		comps.forEach(comp => {
			ops += `<option value="\${comp.cno}" \${comp.cno == cno ? "selected" : ""}>\${comp.name}</option>`;
		});
		document.querySelector("#cno").innerHTML = ops;
	})
	.catch(() => alert("회사 목록 불러오기 실패"));
}

function show(prod){
	document.querySelector("#num").value=prod.num
	document.querySelector("#title").value=prod.title
	document.querySelector("#price").value=prod.price
	document.querySelector("#cno").value=prod.cno
	addOptions(prod.cno)
}
function sele(){
	const num = event.target.innerText.split(" ")[0]
	fetch("${root}/api/v1/prod/"+num)
	.then(resp=>resp.json())
	.then(prod => {
		show(prod);
		print("조회 성공");
	}).catch(error => alert("조회 실패"))
}
function list(){
	fetch("${root}/api/v1/prod")
	.then(response=>response.json())
	.then(prods=>{
		let lis="";
		prods.forEach(prod => {
			lis += `<li onclick="sele()">\${prod.num} \${prod.title} \${prod.price} \${prod.cno? prod.comp.name:""}</li>`;
		});
		document.querySelector('#list').innerHTML=lis;
	})
	.catch(e=>alert("요청 실패"));
}
function formData(){
	let prod = {};
	prod.num=document.querySelector("#num").value;
	prod.title=document.querySelector("#title").value;
	prod.price=document.querySelector("#price").value;
	prod.cno=document.querySelector("#cno").value;
	return prod
}
function regi(){
	fetch("${root}/api/v1/prod", {
		method:"post",
		headers: {"Content-Type":"application/json"},
		body: JSON.stringify(formData())
	})
	.then(response=>response.json())
	.then(data=>{
		document.querySelector("#blst").onclick();
		print("등록 성공")
	})
	.catch(e=>alert("요청 실패"));
}
function upda(){
	fetch("${root}/api/v1/prod", {
		method:"put",
		headers: {"Content-Type":"application/json"},
		body: JSON.stringify(formData())
	})
	.then(response=>response.json())
	.then(data=>{
		document.querySelector("#blst").onclick();
		print("수정 성공")
	})
	.catch(e=>alert("요청 실패"));
}
function dele(){
	fetch("${root}/api/v1/prod/"+document.querySelector("#num").value, {
		method:"delete"
	})
	.then(response=>response.json())
	.then(data=>{
		document.querySelector("#blst").onclick();
		print("삭제 성공")
	})
	.catch(e=>alert("요청 실패"));}
function clea(){
	show({num:"", title:"", price:"", cnt:""});
}
</script>
</body>
</html>
