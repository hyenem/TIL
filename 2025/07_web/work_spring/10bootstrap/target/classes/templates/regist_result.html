<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>메인 페이지</title>
</head>
<body class="bg-light p-4">
<th:block th:replace="~{include/header ::headerFragment}"></th:block>

<h2>[[${result}]]</h2>
<div th:if="${prod!=null}">
	<table>
		<tr><th>상품번호 : </th><td>[[${prod.num}]]</td></tr>
		<tr><th>상품이름 : </th><td>[[${prod.title}]]</td></tr>
		<tr><th>상품가격 : </th><td>[[${prod.price}]]</td></tr>
		<tr><th>상품회사 : </th><td>[[${prod.comp.name}]]</td></tr>		
	</table>
</div>
<div th:if="${prod==null}">
	<p>등록된 상품이 없습니다.</p>
</div>
<p>
<a th:href="@{/regist}">상품등록</a>
<a th:href="@{/list}">상품목록</a>
<a th:href="@{/}">메인으로</a>
</body>
</html>
