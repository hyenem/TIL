<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품관리</title>
</head>
<body>

<div th:fragment="headerFragment">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
	<div class="container mt-4">
		<div class="text-center">
			<h1 id="head">상품관리</h1>
		</div>
		<div class="d-flex justify-content-end mb-2" th:if="${session.loginUser!=null}" id="info">
			<span class="me-2" th:text="'['+${session.loginUser.name}+'] 님 반갑습니다.'">[사용자] 님 반갑습니다.</span>
			<a class="btn btn-outline-secondary btn-sm" th:href="@{/logout}">로그아웃</a>
		</div>
		<hr>
	</div>
	<script th:inline="javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
	<script th:inline="javascript">
	let msg=[[${msg}]];
	if(msg) alert(msg);
	</script>
</div>

</body>
</html>
