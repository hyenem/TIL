spring.application.name=10bootstrap

server.servlet.context-path=/mvc
server.port=8080

#spring.mvc.view.prefix=/WEB-INF/views/
#spring.mvc.view.suffix=.jsp

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Drive
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sf_prod?serverTimezone=UTC
spring.datasource.username=scsa
spring.datasource.password=scsa
#spring.datasource.type=org.springframework.jdbc.datasource.SimpleDriveDataSource

#mybatis.mapper-locations=mappers/**/*.xml
#mybatis.type-aliases-package=com.scsa.sf.dto

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=ture
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

logging.level.com.scsa.sf=debug
logging.pattern.console=%d{HH:mm:ss} [%level] %c{36} %m%n